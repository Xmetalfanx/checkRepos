function assign_repo_url_variables() {

    echo -e "Checking OpenSUSE repos for ${package}"
    [ "${openSUSE_branch}" == "tumbleweed" ] && openSUSE_oss_repo="https://download.opensuse.org/tumbleweed/repo/oss/x86_64/" && openSUSE_nonoss_repo="https://download.opensuse.org/tumbleweed/repo/non-oss/x86_64/"

    [ "${openSUSE_branch}" == "16.0" ] && openSUSE_oss_repo="https://download.opensuse.org/distribution/leap/${openSUSE_branch}/repo/oss/x86_64/" && openSUSE_nonoss_repo="https://download.opensuse.org/distribution/leap/${openSUSE_branch}/repo/non-oss/x86_64/"

}

function display_openSUSE_results() {
    # -z true, if string is empty or null
    # !-z true; if string is NOT empty or null 

    # Tumbleweed
    [ ! -z "${openSUSE_nonoss_result}" ] && echo -e "Non-Opensource Repo Result for ${package} on ${openSUSE_branch}: ${openSUSE_nonoss_result}"


    # Leap
        ## opensuse_branch is what branch OF Leap
    [ ! -z "${openSUSE_oss_result}" ] && echo -e "Opensource Repo Result for ${package} on Leap ${openSUSE_branch}: ${openSUSE_oss_result}"

}


# finds the package (if there)
function find_package() {

    assign_repo_url_variables

    # with just awk and works
    # openSUSE_oss_result=$(curl -Ls "${openSUSE_oss_repo}" | \
    # awk -F ">" -v package_name="./$package-" '$0 ~ package_name && $0 !~ "mirrorlist" { gsub("[a-z]*-",""); gsub(/\.x86.*$/,"", $3); print $3 }' )

    # openSUSE_nonoss_result=$(curl -Ls "${openSUSE_nonoss_repo}" | \
    # awk -F ">" -v package_name="./$package-" '$0 ~ package_name && $0 !~ "mirrorlist" { gsub("[a-z]*-",""); gsub(/\.x86.*$/,"",$3); print $3 }' )


    # trial of above to avoid tail -n 1
    openSUSE_oss_result=$(curl -Ls "${openSUSE_oss_repo}" | \
      awk -F ">" -v package_name="./$package-" \
      '$0 ~ package_name && $0 !~ "mirrorlist" \
        {
          gsub("[a-z]*-","");
          gsub(/\.x86.*$/,"", $3);
          version=$3
        }
        END {
          print version
        }'
      )


    openSUSE_nonoss_result=$(curl -Ls "${openSUSE_nonoss_repo}" | \
      awk -F ">" -v package_name="./$package-" \
        '$0 ~ package_name && $0 !~ "mirrorlist" \
        {
          gsub("[a-z]*-","");
          gsub(/\.x86.*$/,"",$3);
          version=$3
        }
        END {
          print version
        }'
      )


    display_openSUSE_results

}

function check_openSUSE_repo() {
    openSUSE_branch="${1}"
    package="${2}"

    find_package

}
