debian_branches=(
    "bookworm"
    "trixie"
    "forky"
)

function displayDebianBranchInfo() {
    echo -e "Package ${package} version in ${current_debian_branch} is ${current_debian_branch_version}"
}


function check_package_in_repo() {
   echo "Checking if ${package} is in Debian Repos"

    # todo: reword echo statement
    [[ "${current_debian_branch_check}" = *"No such package"* ]] && current_package_exists="false" && echo -e "package ${package} does not exist in the ${current_debian_branch} Debian repo" || current_package_exists="true"

    # if the current package is not in the repo, return
    [ "${current_package_exists}" == "false" ] && return

    displayDebianBranchInfo

}

function assign_debian_variables() {
        current_debian_branch_url="https://packages.debian.org/${current_debian_branch}/${package}"

        current_debian_branch_check=$(curl -Ls "${current_debian_branch_url}" )

        current_debian_branch_version=$(curl -Ls "${current_debian_branch_url}" | awk '/Package:/ { gsub("[()]",""); print $3 }' )

}

# The META fynction called from the main script
function check_debian_repos() {

    for current_debian_branch in "${debian_branches[@]}"
    do
        assign_debian_variables

        check_package_in_repo "${current_debian_branch}"
    done
}