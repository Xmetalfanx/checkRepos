
ubuntu_branches=(
    "jammy" # 20.04
    "noble" # 24.04
    "resolute" # 26.04
    "stonking" # 26.10
)

function display_ubuntu_results() {
    echo -e "Current ${package} version in ${current_ubuntu_branch}: ${current_ubuntu_branch_result}"
}

function get_ubuntu_versions() {

    for current_ubuntu_branch in "${ubuntu_branches[@]}"
    do
        current_ubuntu_branch_url="https://packages.ubuntu.com/${current_ubuntu_branch}/${package}"
        current_ubuntu_branch_result=$( curl -Ls "${current_ubuntu_branch_url}" | awk '/Package:/ {gsub("[()]",""); print $3}' )

        display_ubuntu_results
    done
}


