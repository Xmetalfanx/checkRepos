supported_fedora_versions=(
  "46"
  "45"
  "44"
  "43"
)

 function display_fedora_results() {
    active_version="${1}"

    echo -e "Fedora ${active_version} version of ${package}: ${active_version_results}"
}

function curl_fedora_results() {
    active_version="${1}"

    # likely overkill to be honest... could use $1
    local fedora_branch="fc${active_version}"

    active_version_results=$(curl -Ls "${package_url}" | \
        awk \
            -F "[<>]" \
            -v branch=$fedora_branch \
            ' $0 ~ branch { gsub ("fc[0-9]",""); print $3; exit } '
    )
}

function check_fedora_package_exists() {

    # checks if the package even exists first, and if not, it returns, not doing anything
    [[ "$(curl -Ls ${package_url} )" = *"404 Not Found"* ]] && echo -e "${package} not found in Fedora repos" && return

    # this likely should be elsewhere BUT ... .where does the return above returm TO would be the question
    for active_version in "${supported_fedora_versions[@]}"
    do
        curl_fedora_results "${active_version}"

        display_fedora_results "${active_version}"

    done
}

# the meta function
function check_fedora_repo() {
    package_url="https://packages.fedoraproject.org/pkgs/${package}/${package}"

    check_fedora_package_exists
}