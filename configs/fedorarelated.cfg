
function display_fedora_results() {
    echo -e "Fedora 46 (rawhide) version of ${package}\t ${fedora46_result}"
    echo -e "Fedora 45 version of ${package}:\t\t ${fedora45_result}"
    echo -e "Fedora 44 version of ${package}:\t\t ${fedora44_result}"
    echo -e "Fedora 43 version of ${package}:\t\t ${fedora43_result}"

    user_prompt
}

function curl_fedora_results() {
    fedora_branch="fc$1"

    curl -Ls "${package_url}" | \
        awk \
            -F "[<>]" \
            -v branch=$fedora_branch \
            ' $0 ~ branch { gsub ("fc[0-9]",""); print $3; exit } '

}



function get_fedora_results() {

    #46 is rawhide
    fedora46_result=$(curl_fedora_results "46" )
    
    fedora45_result=$(curl_fedora_results "45" )
    fedora44_result=$(curl_fedora_results "44" )
    fedora43_result=$(curl_fedora_results "43" )
  
}

function check_fedora_package_exists() {

    [[ "$(curl -Ls ${package_url} )" = *"404 Not Found"* ]] && echo -e "${package} not found in Fedora repos" && return

    get_fedora_results

    display_fedora_results
}

# the meta function
function check_fedora_repo() {
    package_url="https://packages.fedoraproject.org/pkgs/${package}/${package}"

    check_fedora_package_exists
}